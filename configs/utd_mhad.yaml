seed: 42
output_dir: runs
dataset:
  name: utd_mhad
  raw_dir: data/raw/UTD-MHAD
  cache_dir: data/processed/utd_mhad
  task: classification
  num_classes: 27
  length: 64
  video_frames: 16
  image_size: 112
  train_subjects: [1, 3, 5, 7]
  val_subjects: [2]
  test_subjects: [4, 6, 8]
model:
  d_model: 128
  heads: 4
  topk: 1
  mode: contrastive_topk
  temperature: 0.1
  contrastive_weight: 0.1
  reliability: true
training:
  epochs: 30
  batch_size: 8
  workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  modality_dropout: 0.1
