seed: 42
output_dir: runs

dataset:
  name: generic
  cache_dir: data/processed/my_dataset
  task: classification
  num_classes: 4

model:
  d_model: 128
  heads: 4
  mode: contrastive_topk
  topk: 1
  temperature: 0.1
  selector_temperature: 0.7
  gumbel: true
  reliability: true
  contrastive_weight: 0.1

  # Publication experiments should normally use strong modality-specific
  # pretrained encoders. All outputs are projected to d_model automatically.
  # Generic encoders remain available for ablations and smoke tests.
  encoders:
    rgb:
      type: timm
      name: vit_base_patch16_224
      pretrained: true
      freeze: false
      in_chans: 3
    depth:
      type: timm
      name: resnet18
      pretrained: true
      freeze: false
      in_chans: 1
    inertial:
      # For specialist pretrained models, extract features offline and use
      # type: precomputed, or add a small registry wrapper in encoders.py.
      type: precomputed
      feature_dim: 256
    skeleton:
      type: precomputed
      feature_dim: 256

training:
  epochs: 30
  batch_size: 16
  workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  modality_dropout: 0.0
  cpu: false
