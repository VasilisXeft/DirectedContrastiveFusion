seed: 42
output_dir: runs

dataset:
  name: deap
  data_path: "C:/Users/vxefteris/Desktop/D/MindSpaces/DEAP Dataset/data_preprocessed_python/data_preprocessed_python"
  video_path: "C:/Users/vxefteris/Desktop/D/MindSpaces/DEAP Dataset/face_video"
  cache_dir: "data/processed/deap"
  task: classification
  num_classes: 2
  label: valence
  binary_threshold: 5.0
  baseline_seconds: 3
  window_seconds: 10
  stride_seconds: 5

loso:
  enabled: true
  subject_column: subject
  validation_strategy: previous_subject
  test_subject: s32

model:
  d_model: 128
  heads: 4
  mode: directed_topk
  topk: 6
  temperature: 0.1
  selector_temperature: 0.7
  gumbel: true
  reliability: true
  contrastive_weight: 0.005
  encoders:
    eeg:
      type: eegnet
      f1: 8
      depth_multiplier: 2
      kernel: 64
      dropout: 0.25
    eda:
      type: physio_cnn1d
      channels: [32, 64, 96]
      kernel: 7
      dropout: 0.2
    ppg:
      type: physio_cnn1d
      channels: [32, 64, 96]
      kernel: 7
      dropout: 0.2
    temp:
      type: physio_cnn1d
      channels: [32, 64, 96]
      kernel: 7
      dropout: 0.2

pretraining:
  enabled: true
  modalities: [eeg, eda, ppg, temp]
  epochs: 30
  patience: 5
  batch_size: 64
  workers: 0
  lr: 0.001
  weight_decay: 0.0001
  cpu: false
  freeze_for_fusion: true

training:
  epochs: 30
  patience: 5
  batch_size: 32
  workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  modality_dropout: 0.0
  cpu: false
